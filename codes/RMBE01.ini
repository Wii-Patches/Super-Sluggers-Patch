$Classic / GameCube controller
*By quatric
*Mario Super Sluggers (USA) (RMBE01)
*Play with a Classic Controller or a GameCube pad: menus, batting, pitching, fielding and running.
*A Wii Remote must still be connected for each player; add the Classic Controller to it, or leave it bare for GameCube.
*These codes keep a few helper routines and variables in low memory at 0x80001820-0x80003000.
*Do not use them together with a loader's own Gecko code handler on a real Wii (it lives there too);
*Dolphin is fine, and so is the patched disc image made by the patcher.
* KPADRead: Classic / GameCube buttons -> remote bits, gestures
